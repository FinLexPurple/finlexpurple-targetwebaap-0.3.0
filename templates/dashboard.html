{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<section class="panel">
  <h2>Welcome, {{ user['full_name'] }}</h2>
  <h3>Your accounts</h3>
  <table class="grid">
    <tr><th>Number</th><th>Type</th><th>Balance</th></tr>
    {% for a in accounts %}
      <tr>
        <td>{{ a['number'] }}</td>
        <td>{{ a['kind'] }}</td>
        <td>${{ '%.2f' % (a['balance_cents'] / 100) }}</td>
      </tr>
    {% endfor %}
  </table>
  <p><a class="btn" href="{{ url_for('invoices') }}">View invoices</a></p>
</section>
{% endblock %}
